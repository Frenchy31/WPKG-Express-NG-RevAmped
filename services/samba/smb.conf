[global]
	server string = %h server
	map to guest = Bad User
	obey pam restrictions = Yes
	pam password change = Yes
	passwd program = /usr/bin/passwd %u
	passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
	unix password sync = Yes
	syslog = 0
	log file = /var/log/samba/log.%m
	max log size = 1000
	dns proxy = No
	usershare allow guests = Yes
	panic action = /usr/share/samba/panic-action %d
	idmap config * : backend = tdb
	strict locking = no
	#client max protocol = SMB3

[WPKG]
	comment = Acces au partage et scripts de WPKG
	path = /home/WPKG
	# The group of the Samba account, field 4 of USER_1 in samba.env (install.sh): no account name is written here.
	valid users = @wpkg
	read only = No
	# The account owns nothing but what it creates, and writes through its group, in wpkg/logs only (install.sh sets
	# that folder to 2775): what it creates stays group-writable, so the owner of the clone can still edit or delete
	# it, and readable by others, so www-data of the wpkg and reports-indexer containers reads it.
	create mask = 0664
	force create mode = 0664
	directory mask = 0775
	force directory mode = 2775

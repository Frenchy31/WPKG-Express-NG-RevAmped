services:
  wpkg:
    image: my-wpkg
    build:
      context: .
      dockerfile: services/wpkg/Dockerfile
      target: prod
    # Values come from services/wpkg/wpkg.env (see wpkg.env.example). Unlike "${VAR}" interpolation,
    # env_file is not overridden by a variable of the shell that runs docker compose.
    env_file: services/wpkg/wpkg.env
    ports:
      - "${WPKG_HTTP_PORT:-80}:80"
    volumes:
      - ./services/wpkg/apache/sites:/etc/apache2/sites-available:z
      - ./services/wpkg/apache/certificates:/etc/apache2/ssl:z
    networks:
      backend:
        ipv4_address: 172.19.0.5

  # Reads the new and changed report files of the share into MySQL: the Reports pages read that table.
  # A failing pass (tables not migrated yet, share unreachable) is logged and retried at the next interval.
  # "$$" is the Compose escape for "$": the shell of the container expands the variables.
  reports-indexer:
    image: my-wpkg
    env_file: services/wpkg/wpkg.env
    user: www-data
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while true; do
          bin/cake reports index || echo "reports index failed with status $$?"
          sleep "$${WPKG_REPORTS_INDEX_INTERVAL:-60}" || sleep 60
        done
    networks:
      - backend

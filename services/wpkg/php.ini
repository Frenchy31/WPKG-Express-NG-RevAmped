; Values come from the container environment (services/wpkg/wpkg.env); the text after ":-" is the default.
date.timezone = ${APP_DEFAULT_TIMEZONE:-UTC}
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = ${PHP_MEMORY_LIMIT:-256M}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE:-16M}
post_max_size = ${PHP_POST_MAX_SIZE:-16M}

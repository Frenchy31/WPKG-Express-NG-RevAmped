# The stack is split in components under services/. COMPOSE_FILE, set in .env (see .env.example),
# lists the Compose files in use: this file first, then one per enabled component. Docker Compose
# resolves every relative path from the directory of the first file, so component files write
# their paths from the repository root. Remove a component from COMPOSE_FILE to disable it.
networks:
  backend:
    # install.bat on the test VM and the hosts_path of clients use fixed addresses.
    ipam:
      config:
        - subnet: 172.19.0.0/16
